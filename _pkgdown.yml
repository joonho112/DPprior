home:
  title: 'DPprior: Prior Elicitation for Dirichlet Process Mixture Models'
  description: |
    Decision-ready prior elicitation on the concentration parameter alpha in
    Dirichlet Process mixture models via Design-Conditional Elicitation (DCE),
    versioned canonical objects, and independently verified calibration.

    This research was supported by the Institute of Education Sciences, U.S. Department of Education, through Grant R305D240078 to the University of Alabama.

    The opinions expressed are those of the author and do not represent views of the Institute or the U.S. Department of Education.
